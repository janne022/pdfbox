name: Java CI with Maven

on:
  push:
    branches: [ "trunk", "main" ]
  pull_request:
    branches: [ "trunk", "main" ]
  workflow_dispatch: # Allows you to click a button to run manually

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11' # Change to '17' or '8' depending on what the project needs
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Tests with Maven
      run: mvn test --batch-mode --fail-at-end

    - name: Upload Test Results (XML)
      # The 'if: always()' ensures this runs even if the tests fail,
      # so you can still download the report to see what went wrong.
      if: always() 
      uses: actions/upload-artifact@v4
      with:
        name: surefire-test-reports
        path: '**/target/surefire-reports/*.xml'
